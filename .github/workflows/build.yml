name: Build rootful iOS 14 OBDeleven DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: obd11-ios14-rootful-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Prepare Settings icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prefs/Resources
          raw="$RUNNER_TEMP/obdeleven-artwork"
          python3 - "$raw" <<'PY'
          import json, pathlib, sys, urllib.request
          destination = pathlib.Path(sys.argv[1])
          req = urllib.request.Request("https://itunes.apple.com/lookup?id=1643119107&country=gb", headers={"User-Agent":"Mozilla/5.0"})
          with urllib.request.urlopen(req, timeout=30) as r:
              payload = json.load(r)
          result = payload["results"][0]
          artwork = result.get("artworkUrl512") or result.get("artworkUrl100") or result.get("artworkUrl60")
          with urllib.request.urlopen(urllib.request.Request(artwork, headers={"User-Agent":"Mozilla/5.0"}), timeout=30) as r:
              destination.write_bytes(r.read())
          PY
          /usr/bin/sips -s format png -z 29 29 "$raw" --out prefs/Resources/icon.png >/dev/null
          /usr/bin/sips -s format png -z 58 58 "$raw" --out prefs/Resources/icon@2x.png >/dev/null
          /usr/bin/sips -s format png -z 87 87 "$raw" --out prefs/Resources/icon@3x.png >/dev/null

      - name: Build rootful package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"
          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.obdelevenupdatebypass"
          test "$(dpkg-deb -f "$deb" Version)" = "1.2.0"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/obd11-check"
          root="$RUNNER_TEMP/obd11-check"
          dylib="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.dylib"
          filter="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.plist"
          bundle="$root/Library/PreferenceBundles/OBDelevenUpdateBypassPrefs.bundle"
          test -s "$dylib"
          test -s "$filter"
          test -s "$bundle/OBDelevenUpdateBypassPrefs"
          xcrun lipo "$dylib" -verify_arch arm64
          xcrun lipo "$bundle/OBDelevenUpdateBypassPrefs" -verify_arch arm64 arm64e
          plutil -lint "$filter"
          plutil -lint "$bundle/Root.plist"
          plutil -lint "$bundle/Info.plist"
          grep -q 'com.voltasit.obdeleven.ios' "$filter"
          grep -q 'com.voltasit.obdeleven.ios.basic' "$filter"
          grep -q '1.9.28' Tweak.m
          grep -q '1704712364' Tweak.m
          grep -q '0x00367F04' Tweak.m
          grep -q '1.9.73' Tweak.m
          grep -q '1785335496' Tweak.m
          grep -q '1.2.1' Tweak.m
          grep -q '12103' Tweak.m
          grep -q '2.11.0' Tweak.m
          grep -q '2147483647' Tweak.m
          grep -q 'spoofedVersion' Tweak.m
          grep -q 'spoofedBuild' Tweak.m
          grep -q 'vagSpoofedVersion' Tweak.m
          grep -q 'vagSpoofedBuild' Tweak.m
          grep -q 'CFBundleShortVersionString' Tweak.m
          grep -q 'CFBundleVersion' Tweak.m
          grep -q 'CFBundleGetValueForInfoDictionaryKey' Tweak.m
          grep -q 'PARSE_API_URL' Tweak.m
          grep -q 'server1.obdeleven.com' Tweak.m
          grep -q 'parse.obdeleven.com' Tweak.m
          grep -q 'api.obdeleven.com' Tweak.m
          grep -q 'x-mobile-app-version' Tweak.m
          grep -q 'x-mobile-app-build' Tweak.m
          grep -q 'X-Parse-App-Display-Version' Tweak.m
          grep -q 'X-Parse-App-Build-Version' Tweak.m
          grep -q 'spoofedVersion' prefs/Resources/Root.plist
          grep -q 'spoofedBuild' prefs/Resources/Root.plist
          grep -q 'vagSpoofedVersion' prefs/Resources/Root.plist
          grep -q 'vagSpoofedBuild' prefs/Resources/Root.plist
          grep -q '2.11.0' prefs/Resources/Root.plist
          grep -q 'PFURLSession' LoginDiagnostics.m
          grep -q 'OBDInstallLoginCompatibility' LoginDiagnostics.m
          echo "OBD11 iOS 14 1.2.0 combined app validation passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBD11-Bypass-iOS14-final
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          title="OBD11 Bypass iOS 14 ${version}"
          notes="Rootful iOS 14 build for OBDeleven 1.2.1 (BMW) and VAG 1.9.28. Adds independent version/build spoofing, current Parse host migration and the VAG update bypass."
          deb="$(echo packages/*.deb)"

          find_release_id() {
            gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${tag}\") | .id" | head -n1 || true
          }

          release_id="$(find_release_id)"
          if [[ -n "$release_id" ]]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f name="$title" -f body="$notes" -F draft=false >/dev/null
            gh release upload "$tag" "$deb" --clobber
            exit 0
          fi

          if gh release create "$tag" "$deb" --target "$GITHUB_SHA" --title "$title" --notes "$notes"; then
            exit 0
          fi

          sleep 3
          release_id="$(find_release_id)"
          if [[ -z "$release_id" ]]; then
            echo "Release creation failed and no draft was found."
            exit 1
          fi

          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -f name="$title" -f body="$notes" -F draft=false >/dev/null
          gh release upload "$tag" "$deb" --clobber

      - name: Remove previous builds
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          final_tag="v${version}"

          while read -r release_id release_tag; do
            [[ -z "${release_id:-}" ]] && continue
            [[ "$release_tag" == "$final_tag" ]] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${release_id}" >/dev/null 2>&1 || true
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${release_tag}" >/dev/null 2>&1 || true
          done < <(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[] | "\(.id) \(.tag_name)"')

          while read -r artifact_id; do
            [[ -z "${artifact_id:-}" ]] && continue
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" >/dev/null 2>&1 || true
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.workflow_run.id != ${GITHUB_RUN_ID}) | .id")
