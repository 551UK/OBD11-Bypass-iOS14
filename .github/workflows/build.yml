name: Build rootful iOS 14 DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: obd11-ios14-rootful-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Verify SDK
        shell: bash
        run: |
          set -euo pipefail
          test -s "$THEOS/sdks/iPhoneOS16.5.sdk/System/Library/PrivateFrameworks/Preferences.framework/Preferences.tbd"

      - name: Prepare Settings icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p prefs/Resources
          raw="$RUNNER_TEMP/obdeleven-artwork"
          python3 - "$raw" <<'PY'
          import json
          import pathlib
          import sys
          import urllib.request

          destination = pathlib.Path(sys.argv[1])
          request = urllib.request.Request(
              "https://itunes.apple.com/lookup?id=1643119107&country=gb",
              headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          if not payload.get("results"):
              raise SystemExit("OBDeleven App Store lookup returned no results")
          result = payload["results"][0]
          artwork = result.get("artworkUrl512") or result.get("artworkUrl100") or result.get("artworkUrl60")
          if not artwork:
              raise SystemExit("OBDeleven artwork URL missing")
          image_request = urllib.request.Request(artwork, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(image_request, timeout=30) as response:
              destination.write_bytes(response.read())
          PY

          /usr/bin/sips -s format png -z 29 29 "$raw" --out prefs/Resources/icon.png >/dev/null
          /usr/bin/sips -s format png -z 58 58 "$raw" --out prefs/Resources/icon@2x.png >/dev/null
          /usr/bin/sips -s format png -z 87 87 "$raw" --out prefs/Resources/icon@3x.png >/dev/null

      - name: Build rootful package
        run: make clean package FINALPACKAGE=1

      - name: Validate package
        shell: bash
        run: |
          set -euo pipefail
          brew install dpkg
          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.obdelevenupdatebypass"
          test "$(dpkg-deb -f "$deb" Version)" = "1.0.0"
          dpkg-deb --info "$deb"
          dpkg-deb -x "$deb" "$RUNNER_TEMP/obd11-check"

          root="$RUNNER_TEMP/obd11-check"
          dylib="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.dylib"
          filter="$root/Library/MobileSubstrate/DynamicLibraries/OBDelevenUpdateBypass.plist"
          entry="$root/Library/PreferenceLoader/Preferences/OBDelevenUpdateBypassPrefs.plist"
          bundle="$root/Library/PreferenceBundles/OBDelevenUpdateBypassPrefs.bundle"
          prefs_binary="$bundle/OBDelevenUpdateBypassPrefs"

          test -s "$dylib"
          test -s "$filter"
          test -s "$entry"
          test -s "$prefs_binary"
          test -s "$bundle/Root.plist"
          test -s "$bundle/Info.plist"
          test -s "$bundle/icon.png"
          test -s "$bundle/icon@2x.png"
          test -s "$bundle/icon@3x.png"

          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          xcrun lipo "$prefs_binary" -verify_arch arm64 arm64e
          plutil -lint "$filter"
          plutil -lint "$entry"
          plutil -lint "$bundle/Root.plist"
          plutil -lint "$bundle/Info.plist"
          otool -L "$dylib"
          otool -L "$prefs_binary"
          echo "Rootful iOS 14 package validation passed."

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OBD11-Bypass-iOS14-rootful
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish release DEB
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          tag="v${version}"
          title="OBD11 Bypass iOS 14 ${version}"
          notes="Rootful iOS 14 build of the OBD11 / OBDeleven update bypass. Uses the same working version, build and request-header spoofing as the iOS 16 build, with separate controls for regular OBD11 and OBD11 VAG."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" packages/*.deb --clobber
            gh release edit "$tag" --title "$title" --notes "$notes"
          else
            gh release create "$tag" packages/*.deb --target "$GITHUB_SHA" --title "$title" --notes "$notes"
          fi
